<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06080a"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c853"/>
      <stop offset="100%" style="stop-color:#00a844"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6b84a"/>
      <stop offset="100%" style="stop-color:#c9963a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Subtle green glow -->
  <circle cx="256" cy="256" r="180" fill="rgba(0,200,83,0.04)"/>

  <!-- Z letter - bold, centered -->
  <text
    x="256"
    y="330"
    font-family="Georgia, serif"
    font-size="280"
    font-weight="900"
    font-style="italic"
    text-anchor="middle"
    fill="url(#zGrad)"
    filter="url(#glow)"
  >Z</text>

  <!-- Gold dot accent - top right of Z -->
  <circle cx="370" cy="140" r="28" fill="url(#dotGrad)" opacity="0.9"/>

  <!-- Bottom label -->
  <text
    x="256"
    y="460"
    font-family="monospace"
    font-size="36"
    font-weight="700"
    text-anchor="middle"
    fill="#5a6a7a"
    letter-spacing="8"
  >ZEDMINDS</text>

  <!-- Zambia flag colors strip at bottom -->
  <rect x="156" y="478" width="40" height="8" rx="4" fill="#198a00"/>
  <rect x="206" y="478" width="40" height="8" rx="4" fill="#de2010"/>
  <rect x="256" y="478" width="40" height="8" rx="4" fill="#000000"/>
  <rect x="306" y="478" width="40" height="8" rx="4" fill="#ef7d00"/>
</svg>
