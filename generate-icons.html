<!DOCTYPE html>
<html>
<head><title>ZedMinds Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192" style="display:none"></canvas>
<canvas id="c512" width="512" height="512" style="display:none"></canvas>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const r = size * 0.156; // border radius

  // Background
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();

  const grad = ctx.createRadialGradient(size*0.3, size*0.3, 0, size*0.5, size*0.5, size*0.7);
  grad.addColorStop(0, '#0f1a12');
  grad.addColorStop(1, '#06080a');
  ctx.fillStyle = grad;
  ctx.fill();

  // Z letter
  ctx.font = `900 italic ${size*0.58}px Georgia, serif`;
  ctx.fillStyle = '#00c853';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Z', size*0.48, size*0.54);

  // Gold dot
  ctx.beginPath();
  ctx.arc(size*0.72, size*0.28, size*0.065, 0, Math.PI*2);
  ctx.fillStyle = '#e6b84a';
  ctx.fill();

  return canvas.toDataURL('image/png');
}

const c192 = document.getElementById('c192');
const c512 = document.getElementById('c512');

const icon192 = drawIcon(c192, 192);
const icon512 = drawIcon(c512, 512);

// Download both
function download(dataUrl, name) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = name;
  a.click();
}

download(icon192, 'icon-192.png');
setTimeout(() => download(icon512, 'icon-512.png'), 500);
document.body.innerHTML = '<h2>Icons downloaded! Upload icon-192.png and icon-512.png to your GitHub repo.</h2><img src="'+icon512+'" style="width:200px;border-radius:40px"><br><img src="'+icon192+'" style="width:100px;border-radius:20px;margin-top:10px">';
</script>
</body>
</html>
